<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<title>Grochu life</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grochu life">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/base.css?v=11">
<link rel="stylesheet" href="css/shell.css?v=11">
<link rel="stylesheet" href="css/sec-habits.css?v=11">
<link rel="stylesheet" href="css/sec-diet.css?v=11">
<link rel="stylesheet" href="css/sec-gym.css?v=11">
<link rel="stylesheet" href="css/sec-recipes.css?v=11">
<link rel="stylesheet" href="css/sec-verses.css?v=11">
<link rel="stylesheet" href="css/sec-account.css?v=11">
<link rel="stylesheet" href="css/look.css?v=11">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="bg-a"></i><i class="bg-b"></i><i class="bg-c"></i></div>

<section class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo"><img src="icons/icon-192.png" alt="" width="72" height="72"></div>
      <h1>Grochu life<i>.</i></h1>
      <p>Nawyki, dieta i siłownia w jednym miejscu.</p>
    </div>
    <nav class="seg auth-tabs" role="tablist" aria-label="Konto" data-m="in">
      <button class="seg-b" type="button" role="tab" data-auth="in" aria-selected="true">Zaloguj się</button>
      <button class="seg-b" type="button" role="tab" data-auth="up" aria-selected="false">Załóż konto</button>
    </nav>
    <form id="auth-form" class="auth-form" novalidate>
      <div class="field"><label for="a-email">E-mail</label><input id="a-email" name="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="a-pass">Hasło</label><input id="a-pass" name="password" type="password" required minlength="6" autocomplete="current-password"></div>
      <div class="field" id="a-pass2-row" hidden><label for="a-pass2">Powtórz hasło</label><input id="a-pass2" name="password2" type="password" minlength="6" autocomplete="new-password"></div>
      <p class="auth-err" id="auth-err" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="a-submit">Zaloguj się</button>
    </form>
    <p class="auth-note">To samo konto co w Habbitcker, Foodcker i Traincker.</p>
  </div>
</section>

<main class="stage" id="stage"></main>
<button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Menu"></button>
<div class="scrim" id="scrim" aria-hidden="true"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Menu sekcji"></aside>
<div class="layers" id="layers"></div>

<script src="js/core.js?v=11"></script>
<script src="js/gym-exercises.js?v=11"></script>
<script src="js/gym-exercises-pl.js?v=11"></script>
<script src="js/sec-gym.js?v=11"></script>
<script src="js/sec-habits.js?v=11"></script>
<script src="js/sec-diet.js?v=11"></script>
<script src="js/sec-recipes.js?v=11"></script>
<script src="js/sec-verses.js?v=11"></script>
<script src="js/sec-account.js?v=11"></script>
</body>
</html>
